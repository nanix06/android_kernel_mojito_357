name: Mojito - STRIX-KernelSU-SUSFS-hbm

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: mojito_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: 16.2
          fetch-depth: 1
          submodules: recursive

      - name: Extraire le diff Anti-Flicker/HBM depuis le kernel InfinityX
        run: |
          git clone --depth=1 -b inline-rom \
            https://github.com/nanix06/kernel_xiaomi_mojito.git /tmp/infinityx-kernel

          echo "== Fichiers du kernel InfinityX mentionnant anti_flicker / hbm / dsi-display-lab =="
          grep -rlZ -E "anti_flicker|dsi-display-lab|regulator\.63" /tmp/infinityx-kernel \
            --include=*.c --include=*.h --include=*.dts --include=*.dtsi 2>/dev/null \
            | tr '\0' '\n' | tee /tmp/matched_files.txt

          mkdir -p /tmp/patches
          if [ -s /tmp/matched_files.txt ]; then
            while IFS= read -r f; do
              rel="${f#/tmp/infinityx-kernel/}"
              name="$(echo "$rel" | tr '/' '_')"
              echo "---- $rel ----"
              if [ -f "$rel" ]; then
                diff -u "$rel" "$f" > "/tmp/patches/${name}.diff" 2>/dev/null
                if [ -s "/tmp/patches/${name}.diff" ]; then
                  echo "  -> diffère du kernel 357, patch généré : ${name}.diff"
                else
                  echo "  -> identique dans les deux kernels (pas la source du problème)"
                  rm -f "/tmp/patches/${name}.diff"
                fi
              else
                echo "  -> n'existe PAS dans le kernel 357 (fichier absent, à ajouter en entier)"
                mkdir -p "/tmp/patches/new_files/$(dirname "$rel")"
                cp "$f" "/tmp/patches/new_files/$rel"
              fi
            done < /tmp/matched_files.txt
          else
            echo "Aucun fichier trouvé avec ces mots-clés : le nom de l'attribut sysfs est peut-être différent, ou généré dynamiquement (device_create_file avec un nom construit en code)."
          fi

          echo "== Résumé des différences trouvées =="
          find /tmp/patches -type f | tee /tmp/patches_summary.txt
          for p in /tmp/patches/*.diff; do
            [ -f "$p" ] && echo "===== $p =====" && cat "$p"
          done

      - name: Publier le diff comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: anti-flicker-hbm-diff
          path: /tmp/patches
          if-no-files-found: warn

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            clang lld llvm

      - name: Vérifier le defconfig disponible
        run: |
          echo "Defconfigs disponibles dans arch/arm64/configs :"
          ls arch/arm64/configs/ | grep -i mojito || ls arch/arm64/configs/

      - name: Ajouter backslashxx KernelSU
        run: |
          git clone --depth=1 \
            https://github.com/backslashxx/KernelSU.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> Kconfig

      - name: Ajouter KProfiles
        run: |
          git clone --depth=1 \
            https://github.com/beakthoven/Kprofiles.git \
            drivers/misc/kprofiles

          printf '\nsource "drivers/misc/kprofiles/Kconfig"\n' >> drivers/misc/Kconfig
          printf '\nobj-$(CONFIG_KPROFILES) += kprofiles/\n' >> drivers/misc/Makefile  
          
      - name: Télécharger et appliquer les patchs SuSFS
        run: |
          git clone --depth=1 -b kernel-4.14 https://github.com/nanix06/susfs4ksu.git susfs

          # 1. Patch du noyau
          patch -p1 --fuzz=3 < susfs/kernel_patches/kernel-4.14.patch
          patch -p1 --fuzz=3 < susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/susfs_fix_nameic.patch || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/fix_stat.c.patch
          grep -q "susfs_def.h" fs/stat.c
          patch -p1 --fuzz=3 < susfs/kernel_patches/55_try_umount_for_susfs.patch || true

          # 2. Patch spécifique à KernelSU
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cd ..

      - name: Configurer le noyau
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          mkdir -p out

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --disable KSU_KPROBES_KSUD
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK

          # SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MAP
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG

          # KProfiles
          ./scripts/config --file out/.config --enable KPROFILES
          ./scripts/config --file out/.config --set-val KP_DEFAULT_MODE 0
          ./scripts/config --file out/.config --disable AUTO_KPROFILES_MSM_DRM
          ./scripts/config --file out/.config --disable AUTO_KPROFILES_MI_DRM
          ./scripts/config --file out/.config --disable AUTO_KPROFILES_FB
          ./scripts/config --file out/.config --enable AUTO_KPROFILES_NONE

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-STRIX❄-SuSFSඞ"

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig
            
      - name: Compiler le noyau
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Envoyer l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-STRIX-KernelSU
          path: release/
          if-no-files-found: error
