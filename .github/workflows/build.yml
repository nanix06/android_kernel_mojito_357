name: Mojito - STRIX-KernelSU 

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: mojito_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source du noyau
        uses: actions/checkout@v4
        with:
          ref: manual-hook-test
          fetch-depth: 1
          submodules: recursive

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip

      - name: Télécharger et installer Neutron Clang via Antman
        run: |
          mkdir -p toolchains/clang
          cd toolchains/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc

      - name: Ajouter backslashxx KernelSU
        run: |
          git clone https://github.com/nanix06/KernelSU-Next.git -b legacy-susfs-v2 KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> Kconfig

      - name: Télécharger et appliquer les patchs SuSFS
        run: |
          git clone --depth=1 -b kernel-4.14 https://github.com/nanix06/susfs4ksu.git susfs

          patch -p1 --fuzz=3 < susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          
      - name: Configurer le noyau
        run: |
          TC_DIR="$GITHUB_WORKSPACE/toolchains"
          export PATH="$TC_DIR/clang/bin:$PATH"

          mkdir -p out
          make O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG"

          # Activation des options
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --disable KSU_KPROBES_KSUD
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE
          ./scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-STRIX-Kernel-SuSFS"

          make O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Compiler le noyau
        run: |
          TC_DIR="$GITHUB_WORKSPACE/toolchains"
          export PATH="$TC_DIR/clang/bin:$PATH"

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Envoyer l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-STRIX-KernelSU-SuSFS
          path: release/
          if-no-files-found: error
