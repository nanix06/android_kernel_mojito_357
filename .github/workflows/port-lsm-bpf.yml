            c35b44e364ebca02f8cf74e4bcf7e223ecf91b05 \
            b4de43abe07fd52af3231fb29638be34abb72f42 \
            e27c2779026992a9b26d97af2ee380afab953c59 \
            e7599801b626407cde3da7db8ab8ca76155e3b3a \
            59063b9fd480cc036e2eb15e7b618d88aca495d1 \
            c654b3ad423becbfd61afd9a32ef19db53009fd0 \
            788746c210d1c78b2e3ad433f0f40acd912b6da8 \
            b7df2536ad108ac2c547efc369f56ebad32232c6 \
            7a1126e71f4d01998d7cfa7753985a77d9a235e0 \
          )

          total=${#COMMITS[@]}
          applied=0
          skipped=0
          failed=""

          for sha in "${COMMITS[@]}"; do
            echo "=== [$((applied+skipped+1))/$total] $sha ==="
            if ! git cat-file -t "$sha" >/dev/null 2>&1; then
              echo "!! SHA introuvable (porté plus loin que le fetch ?): $sha"
              failed="$failed $sha"
              continue
            fi
            # 1) déjà présent ? (le patch inverse s'applique proprement => saut)
            if git show "$sha" | git apply -R --check >/dev/null 2>&1; then
              echo ">> déjà présent, skip"
              skipped=$((skipped+1))
              continue
            fi
            # 2) cherry-pick réel
            if git cherry-pick -x "$sha" >/dev/null 2>cherry.err; then
              echo ">> appliqué"
              applied=$((applied+1))
            else
              echo "!! CONFLIT sur $sha"
              git cherry-pick --abort 2>/dev/null || true
              failed="$failed $sha"
            fi
          done

          echo ""
          echo "================= RÉSUMÉ ================="
          echo "Total   : $total"
          echo "Appliqués: $applied"
          echo "Sauté   : $skipped (déjà présents)"
          echo "Échoués :$failed"
          echo "=========================================="

          echo "failcount=$(echo -n "$failed" | wc -w)" >> "$GITHUB_ENV"
          echo "failed_list=$failed" >> "$GITHUB_ENV"

      - name: Pousser la branche (portage partiel ou complet)
        if: always()
        run: |
          cd k
          git push origin port-lsm-bpf-16.2

      - name: Reporter l'échec si conflits non résolus
        if: env.failcount != '0'
        run: |
          echo "Des conflits restent à résoudre. Commits en échec :${{ env.failed_list }}"
          echo "Clone la branche port-lsm-bpf-16.2, résous chaque commit listé (git show <sha> pour voir le patch) puis force-push."
          exit 1