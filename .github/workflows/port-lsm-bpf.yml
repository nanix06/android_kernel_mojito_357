name: Port LSM/BPF vers strix 16.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le code (strix 16.2)
        uses: actions/checkout@v4
        with:
          repository: nanix06/android_kernel_mojito_357
          ref: 16.2
          path: k
          fetch-depth: 0

      - name: Portage LSM/BPF (cherry-pick ordonné)
        run: |
          cd k
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add sunny https://github.com/nanix06/android_kernel_xiaomi_sunny.git
          git fetch sunny refs/heads/backport-bpf-5.10:refs/heads/bpf10

          git checkout -b port-lsm-bpf-16.2

          # Série complète (du plus ancien au plus récent), extraite de backport-bpf-5.10
          COMMITS=( \
            96d8a2b99c36fdd50d04c8625c4c68e2d7374c9a \
            80ec54f11ed275efd7e7dfd8bb347d37872c58b3 \
            278f0ac06d1369c3842ddba75cfcd1776d4dad3c \
